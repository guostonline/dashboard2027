<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MADEC KPI Analytics - Connexion Espace Sécurisé</title>
    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/static/logo.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/static/css/style.css?v=3.3">
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #050a14;
            font-family: 'Inter', sans-serif;
            overflow: hidden;
            position: relative;
        }
        .login-wrapper {
            position: relative;
            z-index: 100;
            width: 440px;
            max-width: 92vw;
        }
        .login-card {
            background: rgba(13, 23, 42, 0.94);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(0, 212, 255, 0.35);
            box-shadow: 0 0 60px rgba(0, 212, 255, 0.25), inset 0 0 30px rgba(0, 212, 255, 0.05);
            border-radius: 20px;
            padding: 2.75rem 2.25rem;
            position: relative;
            overflow: hidden;
        }
        .glow-top-bar {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 4px;
            background: linear-gradient(90deg, var(--neon-blue, #00d4ff), var(--neon-purple, #a855f7), var(--neon-amber, #ffb703));
        }
        .form-input {
            width: 100%;
            height: 46px;
            background: rgba(0, 0, 0, 0.45);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 8px;
            padding: 0 1rem;
            color: #ffffff;
            font-size: 0.92rem;
            font-family: 'JetBrains Mono', monospace;
            outline: none;
            box-sizing: border-box;
            transition: all 0.2s ease;
        }
        .form-input:focus {
            border-color: var(--neon-blue, #00d4ff);
            box-shadow: 0 0 12px rgba(0, 212, 255, 0.3);
            background: rgba(0, 0, 0, 0.6);
        }
        .login-btn {
            height: 48px;
            width: 100%;
            border-radius: 8px;
            border: 1px solid var(--neon-blue, #00d4ff);
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.25), rgba(168, 85, 247, 0.25));
            box-shadow: 0 0 20px rgba(0, 212, 255, 0.3);
            color: #ffffff;
            font-size: 0.95rem;
            font-weight: 800;
            font-family: 'Inter', sans-serif;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s ease;
        }
        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 212, 255, 0.5);
            background: linear-gradient(135deg, rgba(0, 212, 255, 0.4), rgba(168, 85, 247, 0.4));
        }
    </style>
</head>
<body class="cyber-grid">
    <!-- Animated background particles -->
    <canvas id="bg-particles" aria-hidden="true"></canvas>
    <div class="bg-scanline" aria-hidden="true"></div>
    <div class="bg-vignette" aria-hidden="true"></div>
    <div class="glow-orb orb-1"></div>
    <div class="glow-orb orb-2"></div>

    <div class="login-wrapper">
        <div class="login-card">
            <div class="glow-top-bar"></div>

            <!-- Logo & Brand Header -->
            <div style="text-align: center; margin-bottom: 2rem;">
                <img src="/static/logo.png" alt="MADEC Logo" style="height: 56px; margin-bottom: 0.9rem; filter: drop-shadow(0 0 12px rgba(0, 212, 255, 0.5));">
                <h2 style="font-size: 1.4rem; font-weight: 800; letter-spacing: 2.5px; color: #ffffff; text-transform: uppercase; margin: 0 0 0.4rem 0;">
                    MADEC <span style="color: #00d4ff;">KPI ANALYTICS</span>
                </h2>
                <div style="display: inline-flex; align-items: center; gap: 6px; padding: 4px 14px; border-radius: 12px; background: rgba(0, 212, 255, 0.1); border: 1px solid rgba(0, 212, 255, 0.3); color: #00d4ff; font-size: 0.75rem; font-family: 'JetBrains Mono', monospace; font-weight: 600;">
                    <i class="fa-solid fa-shield-halved"></i> ACCÈS SÉCURISÉ
                </div>
            </div>

            <!-- Error Message Alert -->
            <div id="login-error-alert" style="display: none; align-items: center; gap: 8px; background: rgba(255, 45, 85, 0.12); border: 1px solid #ff0055; color: #ff0055; padding: 0.7rem 0.9rem; border-radius: 8px; font-size: 0.8rem; font-family: 'JetBrains Mono', monospace; margin-bottom: 1.25rem;">
                <i class="fa-solid fa-circle-exclamation"></i>
                <span id="login-error-text">Email ou mot de passe incorrect.</span>
            </div>

            <!-- Login Form -->
            <form id="standalone-login-form" onsubmit="submitLogin(event)" style="display: flex; flex-direction: column; gap: 1.25rem;">
                <div>
                    <label style="display: block; font-size: 0.72rem; font-family: 'JetBrains Mono', monospace; color: #94a3b8; text-transform: uppercase; font-weight: 700; margin-bottom: 0.45rem;">
                        <i class="fa-solid fa-envelope" style="color: #00d4ff; margin-right: 4px;"></i> Adresse Email
                    </label>
                    <input type="email" id="login-email" required placeholder="nom@exemple.com" value="guostonline@gmail.com" class="form-input">
                </div>

                <div>
                    <label style="display: block; font-size: 0.72rem; font-family: 'JetBrains Mono', monospace; color: #94a3b8; text-transform: uppercase; font-weight: 700; margin-bottom: 0.45rem;">
                        <i class="fa-solid fa-lock" style="color: #00d4ff; margin-right: 4px;"></i> Mot de passe
                    </label>
                    <div style="position: relative;">
                        <input type="password" id="login-password" required placeholder="••••••••••••" value="@Iamsorry123#" class="form-input" style="padding-right: 2.75rem;">
                        <button type="button" onclick="togglePasswordView()" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: #94a3b8; cursor: pointer; font-size: 0.9rem; padding: 4px;">
                            <i class="fa-solid fa-eye" id="toggle-eye-icon"></i>
                        </button>
                    </div>
                </div>

                <div style="display: flex; align-items: center; justify-content: space-between; font-size: 0.75rem; color: #94a3b8;">
                    <label style="display: flex; align-items: center; gap: 6px; cursor: pointer; user-select: none;">
                        <input type="checkbox" id="login-remember" checked style="accent-color: #00d4ff; cursor: pointer;"> Se souvenir de moi
                    </label>
                </div>

                <button type="submit" id="login-btn" class="login-btn">
                    <i class="fa-solid fa-lock-open" id="login-icon"></i>
                    <span id="login-text">SE CONNECTER</span>
                </button>
            </form>
        </div>
    </div>

    <!-- Script JS -->
    <script src="/static/js/bg-anim.js?v=5.0"></script>
    <script>
        function togglePasswordView() {
            const input = document.getElementById('login-password');
            const icon = document.getElementById('toggle-eye-icon');
            if (input && icon) {
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.className = 'fa-solid fa-eye-slash';
                } else {
                    input.type = 'password';
                    icon.className = 'fa-solid fa-eye';
                }
            }
        }

        function submitLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email')?.value.trim() || '';
            const password = document.getElementById('login-password')?.value || '';
            const errorAlert = document.getElementById('login-error-alert');
            const errorText = document.getElementById('login-error-text');
            const btn = document.getElementById('login-btn');
            const icon = document.getElementById('login-icon');
            const text = document.getElementById('login-text');

            if (!email || !password) return;

            if (btn) btn.disabled = true;
            if (icon) icon.className = 'fa-solid fa-circle-notch fa-spin';
            if (text) text.innerText = 'VÉRIFICATION...';
            if (errorAlert) errorAlert.style.display = 'none';

            const isValid = (email.toLowerCase() === 'guostonline@gmail.com' && password === '@Iamsorry123#');

            setTimeout(() => {
                if (isValid) {
                    const remember = document.getElementById('login-remember')?.checked;
                    if (remember) {
                        localStorage.setItem('madec_auth', 'true');
                    } else {
                        sessionStorage.setItem('madec_auth', 'true');
                    }
                    if (icon) icon.className = 'fa-solid fa-circle-check';
                    if (text) text.innerText = 'ACCÈS AUTORISÉ';
                    setTimeout(() => {
                        window.location.href = '/dashboard';
                    }, 400);
                } else {
                    if (btn) btn.disabled = false;
                    if (icon) icon.className = 'fa-solid fa-lock-open';
                    if (text) text.innerText = 'SE CONNECTER';
                    if (errorAlert && errorText) {
                        errorText.innerText = 'Email ou mot de passe incorrect. Veuillez réessayer.';
                        errorAlert.style.display = 'flex';
                    }
                }
            }, 400);
        }

        // If already logged in, redirect to dashboard
        document.addEventListener('DOMContentLoaded', () => {
            if (window.location.search.includes('logout=1')) {
                localStorage.removeItem('madec_auth');
                sessionStorage.removeItem('madec_auth');
            }
            const isAuth = localStorage.getItem('madec_auth') === 'true' || sessionStorage.getItem('madec_auth') === 'true';
            if (isAuth && !window.location.search.includes('logout=1')) {
                window.location.href = '/dashboard';
            }
        });
    </script>
</body>
</html>
